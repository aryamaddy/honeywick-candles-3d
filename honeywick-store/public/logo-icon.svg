<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Circular Soft Pink Badge -->
  <circle cx="60" cy="60" r="58" fill="#F5D6DC" stroke="#D87591" stroke-width="2.5" />
  <circle cx="60" cy="60" r="54" fill="none" stroke="#D87591" stroke-width="0.8" stroke-dasharray="2 2" />

  <!-- Illustrated Candle Jar -->
  <rect x="42" y="52" width="36" height="30" rx="4" fill="#FFFFFF" stroke="#8E2949" stroke-width="2" />
  <path d="M42 56 L78 56" stroke="#F5D6DC" stroke-width="2" />
  
  <!-- Candle Wax Fill inside -->
  <rect x="44" y="58" width="32" height="22" rx="2" fill="#FFF8F0" />
  
  <!-- Ribbon on Candle -->
  <path d="M42 66 L78 66" stroke="#8E2949" stroke-width="1.8" />
  <circle cx="60" cy="66" r="2.5" fill="#8E2949" />
  <!-- Bow loops -->
  <path d="M60 66 C 54 60, 52 70, 60 66 Z" fill="#D87591" stroke="#8E2949" stroke-width="1.2" />
  <path d="M60 66 C 66 60, 68 70, 60 66 Z" fill="#D87591" stroke="#8E2949" stroke-width="1.2" />

  <!-- Wick -->
  <line x1="60" y1="52" x2="60" y2="44" stroke="#34231F" stroke-width="2" stroke-linecap="round" />

  <!-- Candle Flame -->
  <path d="M60 32 C 55 40, 56 45, 60 45 C 64 45, 65 40, 60 32 Z" fill="#E7AA51" stroke="#D87591" stroke-width="1" />
  <path d="M60 36 C 58 41, 58 44, 60 44 C 62 44, 62 41, 60 36 Z" fill="#FFF8F0" />

  <!-- Sparkles -->
  <path d="M40 40 L42 42 L40 44 L38 42 Z" fill="#E7AA51" />
  <path d="M80 40 L82 42 L80 44 L78 42 Z" fill="#E7AA51" />
  <path d="M74 30 L75 32 L74 34 L73 32 Z" fill="#E7AA51" />
  <path d="M46 30 L47 32 L46 34 L45 32 Z" fill="#E7AA51" />

  <!-- Decorative Under Bow Flourish -->
  <path d="M48 94 C 54 90, 58 96, 60 93 C 62 96, 66 90, 72 94" stroke="#8E2949" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <circle cx="60" cy="93" r="1.5" fill="#8E2949" />
</svg>
